[package]
name = "wisp"
description = "Wisp, a small focus companion that lives at the top of the screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wisp-core = { path = "../crates/wisp-core" }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-global-shortcut = "2.4.1"

# Same version Tauri uses, so window handles have the same type.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
